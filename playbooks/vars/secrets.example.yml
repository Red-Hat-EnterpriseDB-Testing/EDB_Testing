---
# Secrets Template - AAP Multi-Region AWS Deployment
#
# IMPORTANT: This is a template file. Create actual secrets file:
#   1. Copy this file: cp secrets.example.yml secrets.yml
#   2. Update all values with secure passwords
#   3. Encrypt with Ansible Vault: ansible-vault encrypt secrets.yml
#   4. Add to .gitignore to prevent committing secrets
#
# Usage:
#   ansible-playbook playbook.yml --ask-vault-pass -e @vars/secrets.yml

# ===========================================
# AWS Credentials (if not using AWS CLI)
# ===========================================
aws_access_key_id: AKIAIOSFODNN7EXAMPLE
aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

# ===========================================
# RDS Database Credentials
# ===========================================

# PostgreSQL master user password (used by 'postgres' superuser)
# Requirements: 8-128 characters, no @, ", or /
rds_master_password: ChangeMeToSecurePassword123!

# AAP database user password (used by 'aap' application user)
# Requirements: 8-128 characters
aap_db_password: ChangeMeToAnotherSecurePassword456!

# ===========================================
# AAP Application Credentials
# ===========================================

# Platform Gateway admin password
gateway_admin_password: GatewayAdminPassword789!

# Automation Controller admin password
controller_admin_password: ControllerAdminPassword012!

# Automation Hub admin password
hub_admin_password: HubAdminPassword345!

# Event-Driven Ansible admin password
eda_admin_password: EDAAdminPassword678!

# ===========================================
# HAProxy Stats Interface
# ===========================================

# HAProxy statistics interface credentials
haproxy_stats_user: admin
haproxy_stats_password: HAProxyStatsPassword901!

# ===========================================
# Red Hat Registry Credentials
# ===========================================

# Red Hat Customer Portal credentials for container images
# Get from: https://access.redhat.com/management/api
registry_username: your-rhn-username
registry_password: your-rhn-password

# ===========================================
# SSH Keys
# ===========================================

# If managing SSH keys via Ansible (optional)
# Otherwise, use aws ec2 create-key-pair
ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQ... user@host"

# ===========================================
# Encryption Keys
# ===========================================

# AAP SECRET_KEY (must be identical across DC1 and DC2)
# Generate with: openssl rand -base64 32
aap_secret_key: "ChangeThisToA32CharacterRandomString=="

# ===========================================
# SSL/TLS Certificates
# ===========================================

# If providing custom certificates (optional)
# ssl_certificate: |
#   -----BEGIN CERTIFICATE-----
#   ...
#   -----END CERTIFICATE-----

# ssl_private_key: |
#   -----BEGIN PRIVATE KEY-----
#   ...
#   -----END PRIVATE KEY-----

# ===========================================
# Example: Generate Secure Passwords
# ===========================================
#
# Use these commands to generate secure passwords:
#
# openssl rand -base64 24
# openssl rand -hex 16
# pwgen -s 32 1
# python3 -c "import secrets; print(secrets.token_urlsafe(32))"
#
# Password Requirements:
# - Minimum 12 characters
# - Mix of uppercase, lowercase, numbers, special characters
# - Avoid dictionary words
# - Unique per service
# - Store securely (Ansible Vault, password manager)
