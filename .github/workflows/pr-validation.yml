name: Pull Request Validation

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel in-progress runs for the same PR
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-info:
    name: PR Information
    runs-on: ubuntu-latest

    steps:
      - name: PR Details
        run: |
          echo "============================================="
          echo "Pull Request Validation"
          echo "============================================="
          echo "PR Number: #${{ github.event.pull_request.number }}"
          echo "Title: ${{ github.event.pull_request.title }}"
          echo "Author: ${{ github.event.pull_request.user.login }}"
          echo "Base Branch: ${{ github.event.pull_request.base.ref }}"
          echo "Head Branch: ${{ github.event.pull_request.head.ref }}"
          echo "============================================="

  changed-files:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      yaml_changed: ${{ steps.changes.outputs.yaml }}
      scripts_changed: ${{ steps.changes.outputs.scripts }}
      docs_changed: ${{ steps.changes.outputs.docs }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect file changes
        id: changes
        run: |
          echo "Detecting changed files..."

          # Get list of changed files
          git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD > changed-files.txt

          echo "Changed files:"
          cat changed-files.txt

          # Check for YAML changes
          if grep -E '\.(yaml|yml)$' changed-files.txt > /dev/null; then
            echo "yaml=true" >> $GITHUB_OUTPUT
            echo "✅ YAML files changed"
          else
            echo "yaml=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No YAML files changed"
          fi

          # Check for script changes
          if grep -E '\.(sh)$|^scripts/' changed-files.txt > /dev/null; then
            echo "scripts=true" >> $GITHUB_OUTPUT
            echo "✅ Script files changed"
          else
            echo "scripts=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No script files changed"
          fi

          # Check for docs changes
          if grep -E '^docs/|\.md$' changed-files.txt > /dev/null; then
            echo "docs=true" >> $GITHUB_OUTPUT
            echo "✅ Documentation changed"
          else
            echo "docs=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No documentation changed"
          fi

  yaml-validation:
    name: YAML Validation
    needs: changed-files
    if: needs.changed-files.outputs.yaml_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: |
          yamllint -f colored . || exit 1

      - name: Validate Kubernetes manifests
        run: |
          wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          sudo mv kubeval /usr/local/bin

          find . -type f \( -name "*.yaml" -o -name "*.yml" \) \
            -not -path "./.git/*" \
            -not -path "./.github/*" \
            -exec grep -l "apiVersion:" {} \; | \
          while read -r file; do
            if ! grep -q "kind: Kustomization" "$file"; then
              echo "Validating: $file"
              kubeval --strict --ignore-missing-schemas "$file" || exit 1
            fi
          done

  shell-validation:
    name: Shell Script Validation
    needs: changed-files
    if: needs.changed-files.outputs.scripts_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: error
          ignore_paths: node_modules vendor

      - name: Validate Bash syntax
        run: |
          find . -type f -name "*.sh" -not -path "./.git/*" | while read -r script; do
            echo "Checking syntax: $script"
            bash -n "$script" || exit 1
          done

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Scan for secrets
        run: |
          echo "Scanning for exposed secrets..."

          # Simple pattern matching for common secrets
          PATTERNS=(
            "password\s*=\s*['\"][^'\"]+['\"]"
            "api[_-]?key\s*=\s*['\"][^'\"]+['\"]"
            "secret\s*=\s*['\"][^'\"]+['\"]"
            "token\s*=\s*['\"][^'\"]+['\"]"
            "BEGIN RSA PRIVATE KEY"
            "BEGIN PRIVATE KEY"
          )

          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            if grep -r -i -E "$pattern" . \
              --exclude-dir=.git \
              --exclude-dir=node_modules \
              --exclude-dir=vendor \
              --exclude="*.md" \
              --exclude="pr-validation.yml"; then
              echo "⚠️  Potential secret found matching pattern: $pattern"
              FOUND=1
            fi
          done

          if [ $FOUND -eq 1 ]; then
            echo ""
            echo "❌ Potential secrets detected in code"
            echo "Please review and remove any hardcoded secrets"
            exit 1
          else
            echo "✅ No obvious secrets detected"
          fi

      - name: Check for TODO/FIXME markers
        run: |
          echo "Checking for TODO/FIXME markers..."

          if grep -r -n -E "TODO|FIXME" \
            --include="*.sh" \
            --include="*.yaml" \
            --include="*.yml" \
            --exclude-dir=.git \
            --exclude-dir=node_modules > todos.txt; then
            echo "ℹ️  Found TODO/FIXME markers:"
            cat todos.txt
          else
            echo "✅ No TODO/FIXME markers found"
          fi

  docs-validation:
    name: Documentation Validation
    needs: changed-files
    if: needs.changed-files.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install markdownlint
        run: |
          sudo npm install -g markdownlint-cli

      - name: Run markdownlint
        run: |
          # Create basic config
          cat > .markdownlint.json <<EOF
          {
            "default": true,
            "MD013": false,
            "MD033": false,
            "MD041": false
          }
          EOF

          markdownlint '**/*.md' --ignore node_modules --ignore vendor || echo "Markdown linting warnings found"

      - name: Check for broken links
        run: |
          echo "Checking for broken internal links in documentation..."

          # Find all markdown files
          find docs/ -name "*.md" 2>/dev/null | while read -r file; do
            echo "Checking: $file"

            # Extract markdown links [text](path)
            grep -o '\[.*\](.*\.md)' "$file" | grep -o '(.*\.md)' | tr -d '()' | while read -r link; do
              # Resolve relative path
              link_path=$(dirname "$file")/"$link"

              if [ ! -f "$link_path" ]; then
                echo "  ⚠️  Broken link: $link in $file"
              fi
            done
          done || true

  pr-size-check:
    name: PR Size Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check PR size
        run: |
          echo "Analyzing PR size..."

          # Count changed files
          FILES_CHANGED=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD | wc -l)

          # Count lines changed
          LINES_CHANGED=$(git diff --shortstat origin/${{ github.event.pull_request.base.ref }}...HEAD | grep -oE '[0-9]+ insertion|[0-9]+ deletion' | grep -oE '[0-9]+' | awk '{s+=$1} END {print s}')

          echo "Files changed: $FILES_CHANGED"
          echo "Lines changed: ${LINES_CHANGED:-0}"

          # Warning thresholds
          if [ "$FILES_CHANGED" -gt 50 ]; then
            echo "⚠️  Large PR: $FILES_CHANGED files changed (consider splitting)"
          fi

          if [ "${LINES_CHANGED:-0}" -gt 1000 ]; then
            echo "⚠️  Large PR: ${LINES_CHANGED} lines changed (consider splitting)"
          fi

          # No failure, just informational
          exit 0

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [pr-info, changed-files, yaml-validation, shell-validation, security-scan, docs-validation, pr-size-check]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "============================================="
          echo "PR Validation Summary"
          echo "============================================="
          echo "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
          echo ""

          echo "File Changes:"
          echo "  YAML files: ${{ needs.changed-files.outputs.yaml_changed }}"
          echo "  Scripts: ${{ needs.changed-files.outputs.scripts_changed }}"
          echo "  Docs: ${{ needs.changed-files.outputs.docs_changed }}"
          echo ""

          echo "Validation Results:"

          # Check YAML validation (if it ran)
          if [ "${{ needs.changed-files.outputs.yaml_changed }}" == "true" ]; then
            if [ "${{ needs.yaml-validation.result }}" == "success" ]; then
              echo "  ✅ YAML Validation: PASSED"
            else
              echo "  ❌ YAML Validation: FAILED"
            fi
          else
            echo "  ⏭️  YAML Validation: SKIPPED (no changes)"
          fi

          # Check shell validation (if it ran)
          if [ "${{ needs.changed-files.outputs.scripts_changed }}" == "true" ]; then
            if [ "${{ needs.shell-validation.result }}" == "success" ]; then
              echo "  ✅ Shell Validation: PASSED"
            else
              echo "  ❌ Shell Validation: FAILED"
            fi
          else
            echo "  ⏭️  Shell Validation: SKIPPED (no changes)"
          fi

          # Security scan (always runs)
          if [ "${{ needs.security-scan.result }}" == "success" ]; then
            echo "  ✅ Security Scan: PASSED"
          else
            echo "  ❌ Security Scan: FAILED"
          fi

          # Docs validation (if it ran)
          if [ "${{ needs.changed-files.outputs.docs_changed }}" == "true" ]; then
            if [ "${{ needs.docs-validation.result }}" == "success" ]; then
              echo "  ✅ Docs Validation: PASSED"
            else
              echo "  ⚠️  Docs Validation: WARNINGS"
            fi
          else
            echo "  ⏭️  Docs Validation: SKIPPED (no changes)"
          fi

          echo ""
          echo "============================================="

          # Determine overall status
          FAILED=false

          # YAML validation is required if YAML files changed
          if [ "${{ needs.changed-files.outputs.yaml_changed }}" == "true" ] && \
             [ "${{ needs.yaml-validation.result }}" != "success" ]; then
            FAILED=true
          fi

          # Shell validation is required if scripts changed
          if [ "${{ needs.changed-files.outputs.scripts_changed }}" == "true" ] && \
             [ "${{ needs.shell-validation.result }}" != "success" ]; then
            FAILED=true
          fi

          # Security scan is always required
          if [ "${{ needs.security-scan.result }}" != "success" ]; then
            FAILED=true
          fi

          # Docs validation is optional (warning only)

          if [ "$FAILED" == "true" ]; then
            echo "❌ PR validation FAILED - please fix issues before merging"
            exit 1
          else
            echo "✅ PR validation PASSED - ready for review"
            exit 0
          fi
