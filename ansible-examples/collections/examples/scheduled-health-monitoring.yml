---
# Example: Scheduled health monitoring with alerting
# Usage: ansible-playbook examples/scheduled-health-monitoring.yml -i inventory.yml
# Recommended: Schedule in AAP to run every 5 minutes

- name: PostgreSQL Health Monitoring
  hosts: openshift_clusters
  gather_facts: false
  
  vars:
    # Health check configuration
    check_operator: true
    check_clusters: true
    check_replication: true
    check_pvc_status: true
    check_service_endpoints: true
    
    # Thresholds
    replication_lag_threshold: 10485760  # 10MB
    max_pod_restart_count: 5
    
    # Alerting
    enable_alerts: true
    alert_on_unhealthy: true
    alert_on_replication_lag: true
    
    # AAP Integration
    enable_aap_notifications: true
    aap_webhook_url: "{{ lookup('env', 'AAP_WEBHOOK_URL') | default('') }}"
    
    # Reporting
    generate_report: true
    save_report: true
    report_format: json
    report_output_dir: /var/log/postgres-health
    
    # Display configuration
    show_cluster_details: true
    show_pod_details: true
    show_replication_details: true
  
  roles:
    - role: edb.postgres_operations.check_health

- name: Aggregate and Report
  hosts: localhost
  gather_facts: false
  
  tasks:
    - name: Collect all health reports
      ansible.builtin.set_fact:
        all_health_results: "{{ groups['openshift_clusters'] | map('extract', hostvars, 'health_report') | list }}"
      when: hostvars[groups['openshift_clusters'][0]].health_report is defined
    
    - name: Count unhealthy datacenters
      ansible.builtin.set_fact:
        unhealthy_count: "{{ all_health_results | selectattr('status', 'equalto', 'UNHEALTHY') | list | length }}"
      when: all_health_results is defined
    
    - name: Display summary
      ansible.builtin.debug:
        msg:
          - "═══════════════════════════════════════════════════════"
          - "Multi-Datacenter Health Summary"
          - "═══════════════════════════════════════════════════════"
          - "Total Datacenters: {{ groups['openshift_clusters'] | length }}"
          - "Unhealthy Datacenters: {{ unhealthy_count | default(0) }}"
          - "Status: {{ 'ALL HEALTHY' if unhealthy_count | default(0) | int == 0 else 'ISSUES DETECTED' }}"
          - "═══════════════════════════════════════════════════════"
    
    - name: Send aggregated alert
      ansible.builtin.uri:
        url: "{{ aap_webhook_url }}"
        method: POST
        body_format: json
        body:
          summary: "Multi-datacenter health check completed"
          total_datacenters: "{{ groups['openshift_clusters'] | length }}"
          unhealthy_count: "{{ unhealthy_count | default(0) }}"
          details: "{{ all_health_results }}"
          timestamp: "{{ ansible_date_time.iso8601 }}"
        status_code: [200, 201, 204]
      when: 
        - enable_aap_notifications | bool
        - aap_webhook_url != ""
        - unhealthy_count | default(0) | int > 0
      ignore_errors: true
