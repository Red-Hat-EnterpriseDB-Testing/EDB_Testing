---
# Default variables for check_health role
# These can be overridden at playbook level or via extra vars

# Health Check Configuration
check_operator: true
check_clusters: true
check_replication: true
check_backups: false
check_connectivity: true
check_disk_usage: false

# Replication Configuration
replication_lag_threshold: 10485760  # 10MB in bytes
replication_lag_warning: 5242880     # 5MB in bytes

# Alert Configuration
enable_alerts: false
alert_on_unhealthy: true
alert_on_replication_lag: true
alert_on_pod_issues: true

# AAP Integration
aap_webhook_url: ""
enable_aap_notifications: false

# Output Configuration
generate_report: true
report_format: "text"  # Options: text, json, yaml, html
report_output_dir: "/tmp/postgres-health-reports"
save_report: false

# Monitoring Thresholds
min_required_instances: 1
max_pod_restart_count: 5
max_pod_pending_time: 300  # seconds

# Detailed Checks
check_pod_resources: true
check_pvc_status: true
check_network_policies: false
check_service_endpoints: true

# Performance Metrics
collect_metrics: false
metrics_query_endpoint: ""
prometheus_url: ""

# Display Configuration
show_cluster_details: true
show_pod_details: true
show_replication_details: true
show_summary_only: false
verbose_output: false

# Failure Handling
fail_on_unhealthy: false
continue_on_check_failure: true

# Cache Configuration
cache_results: false
cache_ttl: 300  # seconds
