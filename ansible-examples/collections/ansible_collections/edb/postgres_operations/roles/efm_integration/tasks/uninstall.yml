---
# Uninstall EFM AAP integration

- name: uninstall | Remove EFM integration scripts
  ansible.builtin.file:
    path: "{{ efm_integration_script_target_dir }}/{{ item['target_name'] }}"
    state: absent
  loop: "{{ efm_integration_scripts_to_install }}"
  loop_control:
    label: "{{ item['target_name'] }}"
  register: __efm_integration_scripts_removed

- name: uninstall | Remove kubeconfig for efm user
  ansible.builtin.file:
    path: "{{ efm_integration_kubeconfig_target }}"
    state: absent
  when: efm_integration_aap_deployment_type == 'openshift'

- name: uninstall | Check if EFM properties backup exists
  ansible.builtin.find:
    paths: "{{ efm_integration_efm_config_dir }}"
    patterns: "efm.properties.backup-*"
  register: __efm_integration_backups

- name: uninstall | Restore EFM configuration from most recent backup
  when:
    - __efm_integration_backups.matched > 0
    - efm_integration_backup_config | bool
  block:
    - name: uninstall | Get most recent backup
      ansible.builtin.set_fact:
        __efm_integration_latest_backup: "{{ __efm_integration_backups.files | sort(attribute='mtime') | last }}"

    - name: uninstall | Restore configuration
      ansible.builtin.copy:
        src: "{{ __efm_integration_latest_backup['path'] }}"
        dest: "{{ efm_integration_efm_properties_file }}"
        remote_src: true
        owner: "{{ efm_integration_efm_user }}"
        group: "{{ efm_integration_efm_group }}"
        mode: "0600"
      notify: restart efm

- name: uninstall | Remove script configuration from EFM properties
  ansible.builtin.lineinfile:
    path: "{{ efm_integration_efm_properties_file }}"
    regexp: "{{ item }}"
    state: absent
  loop:
    - "^script.post.promotion="
    - "^enable.custom.scripts="
  when: __efm_integration_backups.matched == 0
  notify: restart efm

- name: uninstall | Display uninstall summary
  ansible.builtin.debug:
    msg:
      - "✓ EFM AAP Integration Uninstalled"
      - "Scripts Removed: {{ __efm_integration_scripts_removed.results | selectattr('changed', 'equalto', true) | list | length }}"
      - "Configuration: {{ 'Restored from backup' if __efm_integration_backups.matched > 0 else 'Modified' }}"
      - ""
      - "Next Steps:"
      - "1. Restart EFM: systemctl restart edb-efm-{{ efm_integration_efm_version }}"
      - "2. Verify EFM is running: systemctl status edb-efm-{{ efm_integration_efm_version }}"
