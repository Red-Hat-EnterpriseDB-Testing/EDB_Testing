# defaults file for manage_aap_cluster

# Deployment type: openshift or rhel
manage_aap_cluster_deployment_type: openshift

# OpenShift configuration
manage_aap_cluster_namespace: ansible-automation-platform
manage_aap_cluster_kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default('~/.kube/config', true) }}"
manage_aap_cluster_context: ""

# Target replica counts for scale_up action
manage_aap_cluster_replicas:
  aap_gateway: 3
  automation_controller_operator_controller_manager: 1
  automation_controller_task: 3
  automation_controller_web: 3
  automation_hub_operator_controller_manager: 1
  automation_hub_api: 2
  automation_hub_content: 2
  automation_hub_worker: 2

# Deployment name mapping
manage_aap_cluster_deployments:
  - aap-gateway
  - automation-controller-operator-controller-manager
  - automation-controller-task
  - automation-controller-web
  - automation-hub-operator-controller-manager
  - automation-hub-api
  - automation-hub-content
  - automation-hub-worker

# Wait for pods to be ready after scale_up
manage_aap_cluster_wait_for_ready: true
manage_aap_cluster_wait_timeout: 300
manage_aap_cluster_wait_delay: 10

# Minimum number of ready pods to consider cluster healthy
manage_aap_cluster_min_ready_pods: 10

# RHEL systemd services (ordered for proper startup/shutdown)
manage_aap_cluster_services_start_order:
  - postgresql
  - redis
  - receptor
  - automation-controller
  - automation-hub
  - nginx

manage_aap_cluster_services_stop_order:
  - nginx
  - automation-hub
  - automation-controller
  - receptor
  - redis
  - postgresql

# Logging
manage_aap_cluster_log_file: /var/log/aap-cluster-management.log

# API health check
manage_aap_cluster_health_check_enabled: true
manage_aap_cluster_health_check_url: ""  # Auto-detected if not specified
manage_aap_cluster_health_check_timeout: 30
