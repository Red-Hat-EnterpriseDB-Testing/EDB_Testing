---
# Main tasks for deploy_cluster role

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - cluster_name is defined
      - namespace is defined
      - kubeconfig_path is defined
      - datacenter is defined
    fail_msg: "Required variables are missing. Check cluster_name, namespace, kubeconfig_path, and datacenter."

- name: Ensure namespace exists
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ namespace }}"
        labels:
          datacenter: "{{ datacenter }}"
          managed-by: ansible-automation-platform
          app: postgresql

- name: Copy EDB pull secret to namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ edb_pull_secret_name }}"
        namespace: "{{ namespace }}"
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ lookup('file', edb_pull_secret_file) | b64encode }}"
  when: edb_pull_secret_file is defined

- name: Create database credentials secret
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ cluster_name }}-superuser"
        namespace: "{{ namespace }}"
      type: kubernetes.io/basic-auth
      stringData:
        username: postgres
        password: "{{ db_superuser_password | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32')) }}"

- name: Create application user secret
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ cluster_name }}-app-user"
        namespace: "{{ namespace }}"
      type: kubernetes.io/basic-auth
      stringData:
        username: "{{ bootstrap_owner }}"
        password: "{{ db_app_password | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32')) }}"
  when: create_app_user_secret | bool

- name: Deploy PostgreSQL Cluster
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: postgresql.k8s.enterprisedb.io/v1
      kind: Cluster
      metadata:
        name: "{{ cluster_name }}"
        namespace: "{{ namespace }}"
        labels:
          datacenter: "{{ datacenter }}"
          environment: "{{ environment | default('production') }}"
      spec:
        instances: "{{ instances }}"
        imageName: "docker.enterprisedb.com/k8s/postgresql:{{ postgres_version }}"
        
        bootstrap:
          initdb:
            database: "{{ bootstrap_database }}"
            owner: "{{ bootstrap_owner }}"
            secret:
              name: "{{ cluster_name }}-app-user"
        
        storage:
          size: "{{ storage_size }}"
          storageClass: "{{ storage_class }}"
        
        walStorage:
          size: "{{ storage_wal_size | default(storage_size) }}"
          storageClass: "{{ storage_class }}"
        
        imagePullSecrets:
          - name: "{{ edb_pull_secret }}"
        
        resources:
          requests:
            memory: "{{ resource_requests_memory }}"
            cpu: "{{ resource_requests_cpu }}"
          limits:
            memory: "{{ resource_limits_memory }}"
            cpu: "{{ resource_limits_cpu }}"
        
        monitoring:
          enablePodMonitor: "{{ monitoring_pod_monitor }}"
        
        postgresql:
          parameters:
            max_connections: "{{ pg_max_connections }}"
            shared_buffers: "{{ pg_shared_buffers }}"
            work_mem: "{{ pg_work_mem }}"
            maintenance_work_mem: "{{ pg_maintenance_work_mem }}"
            effective_cache_size: "{{ pg_effective_cache_size }}"
        
        "{{ backup_config if backup_enabled else {} }}"

- name: Create PodDisruptionBudget for high availability
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: "{{ cluster_name }}-pdb"
        namespace: "{{ namespace }}"
      spec:
        minAvailable: "{{ min_available_instances }}"
        selector:
          matchLabels:
            postgresql: "{{ cluster_name }}"
  when: enable_pod_disruption_budget | bool

- name: Wait for cluster to be ready
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Cluster
    namespace: "{{ namespace }}"
    name: "{{ cluster_name }}"
    api_version: postgresql.k8s.enterprisedb.io/v1
  register: cluster_status
  until: >
    cluster_status.resources | length > 0 and
    cluster_status.resources[0].status.phase is defined and
    cluster_status.resources[0].status.phase == "Cluster in healthy state"
  retries: "{{ wait_retries }}"
  delay: "{{ wait_delay }}"
  when: wait_for_cluster_ready | bool

- name: Get cluster information
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Cluster
    namespace: "{{ namespace }}"
    name: "{{ cluster_name }}"
    api_version: postgresql.k8s.enterprisedb.io/v1
  register: cluster_info

- name: Set cluster facts
  ansible.builtin.set_fact:
    cluster_primary: "{{ cluster_info.resources[0].status.currentPrimary | default('N/A') }}"
    cluster_phase: "{{ cluster_info.resources[0].status.phase | default('Unknown') }}"
    cluster_instances: "{{ cluster_info.resources[0].status.instances | default(0) }}"
    cluster_ready_instances: "{{ cluster_info.resources[0].status.readyInstances | default(0) }}"
    cluster_rw_service: "{{ cluster_name }}-rw.{{ namespace }}.svc.cluster.local"
    cluster_ro_service: "{{ cluster_name }}-ro.{{ namespace }}.svc.cluster.local"
    cluster_r_service: "{{ cluster_name }}-r.{{ namespace }}.svc.cluster.local"

- name: Display cluster deployment summary
  ansible.builtin.debug:
    msg:
      - "═══════════════════════════════════════════════════════"
      - "PostgreSQL Cluster Deployed Successfully"
      - "═══════════════════════════════════════════════════════"
      - "Cluster Name: {{ cluster_name }}"
      - "Namespace: {{ namespace }}"
      - "Datacenter: {{ datacenter }}"
      - "Phase: {{ cluster_phase }}"
      - "Instances: {{ cluster_ready_instances }}/{{ cluster_instances }}"
      - "Primary Pod: {{ cluster_primary }}"
      - "PostgreSQL Version: {{ postgres_version }}"
      - "───────────────────────────────────────────────────────"
      - "Connection Endpoints:"
      - "  Read-Write: {{ cluster_rw_service }}:5432"
      - "  Read-Only:  {{ cluster_ro_service }}:5432"
      - "  Read:       {{ cluster_r_service }}:5432"
      - "───────────────────────────────────────────────────────"
      - "Credentials stored in secrets:"
      - "  {{ cluster_name }}-superuser (postgres)"
      - "  {{ cluster_name }}-app-user ({{ bootstrap_owner }})"
      - "═══════════════════════════════════════════════════════"
