---
galaxy_info:
  role_name: deploy_cluster
  author: EDB Engineering Team
  description: Deploy EnterpriseDB Postgres for Kubernetes clusters
  company: EnterpriseDB
  
  license: Apache-2.0
  
  min_ansible_version: "2.14"
  
  platforms:
    - name: EL
      versions:
        - 8
        - 9
    - name: Fedora
      versions:
        - 38
        - 39
    - name: Ubuntu
      versions:
        - focal
        - jammy

  galaxy_tags:
    - postgresql
    - database
    - kubernetes
    - openshift
    - edb
    - postgres
    - operator
    - deployment

dependencies:
  - role: validate_prerequisites
    when: validate_prerequisites_enabled | default(false)

collections:
  - kubernetes.core
  - community.postgresql
