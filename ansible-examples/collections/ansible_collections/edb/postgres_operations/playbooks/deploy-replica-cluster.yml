---
# Playbook: Deploy PostgreSQL Replica Cluster
# This playbook deploys a PostgreSQL replica cluster using the deploy_replica_cluster role

- name: Deploy PostgreSQL Replica Cluster on OpenShift
  hosts: openshift_clusters
  gather_facts: false
  
  tasks:
    - name: Deploy replica cluster
      ansible.builtin.include_role:
        name: edb.postgres_operations.deploy_replica_cluster
      vars:
        # Replica cluster configuration
        replica_cluster_name: "{{ replica_cluster_name | default('my-postgres-replica') }}"
        replica_namespace: "{{ replica_namespace | default('default') }}"
        replica_instances: "{{ replica_instances | default(3) }}"
        replica_storage_size: "{{ replica_storage_size | default('10Gi') }}"
        replica_postgres_version: "{{ replica_postgres_version | default('16.8') }}"
        replica_datacenter: "{{ replica_datacenter | default('dc2') }}"
        
        # Source cluster configuration
        source_cluster_name: "{{ source_cluster_name | default('my-postgres') }}"
        source_namespace: "{{ source_namespace | default('default') }}"
        
        # Replica strategy
        replica_strategy: "{{ replica_strategy | default('distributed_topology') }}"
        global_primary_cluster: "{{ global_primary_cluster | default(source_cluster_name) }}"
        
        # Bootstrap method
        bootstrap_method: "{{ bootstrap_method | default('pg_basebackup') }}"
        
        # Replication configuration
        enable_streaming_replication: "{{ enable_streaming_replication | default(true) }}"
        enable_wal_archive_replication: "{{ enable_wal_archive_replication | default(true) }}"
