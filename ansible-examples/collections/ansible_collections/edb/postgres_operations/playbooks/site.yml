---
# Main site playbook for PostgreSQL operations
# This playbook demonstrates the full workflow for managing PostgreSQL clusters

- name: PostgreSQL Cluster Management Workflow
  hosts: all
  gather_facts: false
  
  vars_prompt:
    - name: operation
      prompt: "What operation would you like to perform? (deploy/health/sql/all)"
      private: false
      default: "health"

  tasks:
    - name: Display selected operation
      ansible.builtin.debug:
        msg: "Selected operation: {{ operation }}"

- name: Deploy PostgreSQL Clusters
  ansible.builtin.import_playbook: deploy-cluster.yml
  when: operation == "deploy" or operation == "all"

- name: Check Cluster Health
  ansible.builtin.import_playbook: check-health.yml
  when: operation == "health" or operation == "all"

- name: Execute SQL Queries
  ansible.builtin.import_playbook: execute-sql.yml
  when: operation == "sql" or operation == "all"
