---
# Playbook: Deploy PostgreSQL Cluster using collection role
# This playbook deploys a PostgreSQL cluster using the deploy_cluster role

- name: Deploy PostgreSQL Cluster on OpenShift
  hosts: openshift_clusters
  gather_facts: false
  
  roles:
    - role: edb.postgres_operations.deploy_cluster
      vars:
        cluster_name: "{{ cluster_name | default('my-postgres') }}"
        namespace: "{{ namespace | default('default') }}"
        instances: "{{ instances | default(3) }}"
        storage_size: "{{ storage_size | default('10Gi') }}"
        postgres_version: "{{ postgres_version | default('16.8') }}"
