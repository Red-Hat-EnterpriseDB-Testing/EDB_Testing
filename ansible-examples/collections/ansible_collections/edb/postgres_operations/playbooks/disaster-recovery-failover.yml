---
# Playbook: disaster-recovery-failover.yml
# Complete disaster recovery failover procedure
# Orchestrates database promotion and AAP cluster activation

- name: Disaster Recovery Failover Orchestration
  hosts: localhost
  gather_facts: false
  
  vars:
    # Source and target datacenters
    source_dc: "{{ failover_source_dc | default('dc1') }}"
    target_dc: "{{ failover_target_dc | default('dc2') }}"
    
    # OpenShift contexts
    dc_contexts:
      dc1: api-crc-testing:6443
      dc2: api-chadsno2026-fteam-local:6443
    
    # AAP configuration
    aap_namespace: ansible-automation-platform
    
    # Failover mode: automatic or manual
    failover_mode: "{{ dr_failover_mode | default('manual') }}"
    
    # Confirmation required for production
    require_confirmation: "{{ dr_require_confirmation | default(true) }}"
    
  tasks:
    - name: Display failover plan
      ansible.builtin.debug:
        msg:
          - "╔════════════════════════════════════════╗"
          - "║  DISASTER RECOVERY FAILOVER PLAN      ║"
          - "╚════════════════════════════════════════╝"
          - ""
          - "Source Datacenter (Failed): {{ source_dc | upper }}"
          - "Target Datacenter (Active): {{ target_dc | upper }}"
          - "Failover Mode: {{ failover_mode | upper }}"
          - ""
          - "Actions to be performed:"
          - "1. Verify source datacenter is unavailable"
          - "2. Scale up AAP in {{ target_dc | upper }}"
          - "3. Wait for AAP to be operational"
          - "4. Verify AAP health in {{ target_dc | upper }}"
          - "5. Update monitoring and alerts"
          - ""
          - "⚠️  This is a PRODUCTION operation"
      tags:
        - always
    
    - name: Confirm failover execution
      ansible.builtin.pause:
        prompt: |
          
          Are you sure you want to proceed with DISASTER RECOVERY FAILOVER?
          
          This will:
          - Scale up AAP cluster in {{ target_dc | upper }}
          - Make {{ target_dc | upper }} the active datacenter
          
          Type 'yes' to continue, or press Ctrl+C to cancel
      register: failover_confirmation
      when:
        - require_confirmation | bool
        - failover_mode == 'manual'
      tags:
        - always
    
    - name: Validate confirmation
      ansible.builtin.fail:
        msg: "Failover cancelled by user"
      when:
        - require_confirmation | bool
        - failover_mode == 'manual'
        - failover_confirmation.user_input | default('no') | lower != 'yes'
      tags:
        - always
    
    - name: Record failover initiation
      ansible.builtin.debug:
        msg:
          - "✓ Failover confirmed and initiated"
          - "Timestamp: {{ ansible_date_time.iso8601 }}"
          - "Operator: {{ lookup('env', 'USER') }}"
      tags:
        - always
    
    - name: Check source datacenter status
      kubernetes.core.k8s_info:
        kind: Node
        kubeconfig: ~/.kube/config
        context: "{{ dc_contexts[source_dc] }}"
      register: source_dc_check
      failed_when: false
      tags:
        - verify
    
    - name: Confirm source datacenter is unavailable
      ansible.builtin.assert:
        that:
          - source_dc_check.failed | default(false)
        fail_msg: "Source datacenter {{ source_dc | upper }} appears to be available. Failover aborted for safety."
        success_msg: "✓ Confirmed: Source datacenter {{ source_dc | upper }} is unavailable"
      when: failover_mode == 'manual'
      tags:
        - verify
    
    - name: Scale up AAP cluster in target datacenter
      ansible.builtin.include_role:
        name: edb.postgres_operations.manage_aap_cluster
      vars:
        manage_aap_cluster_action: scale_up
        manage_aap_cluster_deployment_type: openshift
        manage_aap_cluster_namespace: "{{ aap_namespace }}"
        manage_aap_cluster_context: "{{ dc_contexts[target_dc] }}"
        manage_aap_cluster_wait_for_ready: true
        manage_aap_cluster_wait_timeout: 600
      tags:
        - scale_aap
    
    - name: Get AAP route in target datacenter
      kubernetes.core.k8s_info:
        kind: Route
        namespace: "{{ aap_namespace }}"
        kubeconfig: ~/.kube/config
        context: "{{ dc_contexts[target_dc] }}"
      register: target_aap_route
      tags:
        - verify
    
    - name: Set AAP URL
      ansible.builtin.set_fact:
        target_aap_url: "https://{{ target_aap_route.resources[0].spec.host }}"
      when: target_aap_route.resources | length > 0
      tags:
        - verify
    
    - name: Wait for AAP API to be healthy
      ansible.builtin.uri:
        url: "{{ target_aap_url }}/api/v2/ping/"
        validate_certs: false
        status_code: 200
        timeout: 30
      register: aap_health
      until: aap_health.status == 200
      retries: 30
      delay: 10
      tags:
        - verify
    
    - name: Verify AAP cluster status
      ansible.builtin.include_role:
        name: edb.postgres_operations.manage_aap_cluster
      vars:
        manage_aap_cluster_action: status
        manage_aap_cluster_deployment_type: openshift
        manage_aap_cluster_namespace: "{{ aap_namespace }}"
        manage_aap_cluster_context: "{{ dc_contexts[target_dc] }}"
      tags:
        - verify
    
    - name: Scale down AAP in source datacenter (if accessible)
      ansible.builtin.include_role:
        name: edb.postgres_operations.manage_aap_cluster
      vars:
        manage_aap_cluster_action: scale_down
        manage_aap_cluster_deployment_type: openshift
        manage_aap_cluster_namespace: "{{ aap_namespace }}"
        manage_aap_cluster_context: "{{ dc_contexts[source_dc] }}"
      when: not source_dc_check.failed | default(true)
      failed_when: false
      tags:
        - cleanup
    
    - name: Display failover completion summary
      ansible.builtin.debug:
        msg:
          - "╔════════════════════════════════════════╗"
          - "║  FAILOVER COMPLETED SUCCESSFULLY      ║"
          - "╚════════════════════════════════════════╝"
          - ""
          - "Active Datacenter: {{ target_dc | upper }}"
          - "AAP URL: {{ target_aap_url | default('Not available') }}"
          - "AAP Health: {{ 'Healthy ✓' if aap_health.status == 200 else 'Unknown' }}"
          - ""
          - "Post-Failover Actions Required:"
          - "1. Update global load balancer to route to {{ target_dc | upper }}"
          - "2. Notify stakeholders of datacenter change"
          - "3. Update monitoring dashboards"
          - "4. Document failover in incident log"
          - "5. Plan failback procedure when {{ source_dc | upper }} is restored"
          - ""
          - "Failback Command:"
          - "ansible-playbook disaster-recovery-failover.yml \\"
          - "  -e 'failover_source_dc={{ target_dc }}' \\"
          - "  -e 'failover_target_dc={{ source_dc }}'"
      tags:
        - always
