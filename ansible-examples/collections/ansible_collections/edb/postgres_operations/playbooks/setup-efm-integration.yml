# Playbook: setup-efm-integration.yml
# Setup EFM integration with AAP cluster management

- name: Setup EFM AAP Integration
  hosts: "{{ target_hosts | default('efm_nodes') }}"
  gather_facts: true
  become: true
  
  vars:
    # EFM version
    efm_version: "{{ efm_integration_efm_version | default('4.7') }}"
    
    # AAP deployment type
    aap_deployment: "{{ efm_integration_aap_deployment_type | default('openshift') }}"
    
    # Use orchestrated failover (includes notifications)
    use_orchestrated: "{{ efm_integration_use_orchestrated_failover | default(false) }}"
    
  tasks:
    - name: Display setup configuration
      ansible.builtin.debug:
        msg:
          - "EFM AAP Integration Setup"
          - "========================"
          - "EFM Version: {{ efm_version }}"
          - "AAP Deployment: {{ aap_deployment }}"
          - "Orchestrated Failover: {{ use_orchestrated }}"
          - "Target Hosts: {{ ansible_play_hosts | join(', ') }}"
      tags:
        - always
    
    - name: Install EFM integration scripts
      ansible.builtin.include_role:
        name: edb.postgres_operations.efm_integration
      vars:
        efm_integration_action: install
        efm_integration_efm_version: "{{ efm_version }}"
        efm_integration_aap_deployment_type: "{{ aap_deployment }}"
        efm_integration_use_orchestrated_failover: "{{ use_orchestrated }}"
      tags:
        - install
    
    - name: Configure EFM to use integration scripts
      ansible.builtin.include_role:
        name: edb.postgres_operations.efm_integration
      vars:
        efm_integration_action: configure
        efm_integration_efm_version: "{{ efm_version }}"
        efm_integration_use_orchestrated_failover: "{{ use_orchestrated }}"
      tags:
        - configure
    
    - name: Test EFM integration
      ansible.builtin.include_role:
        name: edb.postgres_operations.efm_integration
      vars:
        efm_integration_action: test
        efm_integration_test_datacenter: "{{ test_datacenter | default('dc2') }}"
      when: run_test | default(false) | bool
      tags:
        - test
    
    - name: Display post-installation instructions
      ansible.builtin.debug:
        msg:
          - "✓ EFM AAP Integration Setup Complete"
          - ""
          - "Next Steps:"
          - "1. Restart EFM service on all nodes:"
          - "   systemctl restart edb-efm-{{ efm_version }}"
          - ""
          - "2. Verify EFM cluster status:"
          - "   /usr/edb/efm-{{ efm_version }}/bin/efm cluster-status efm-cluster"
          - ""
          - "3. Test the integration:"
          - "   ansible-playbook setup-efm-integration.yml -e 'run_test=true test_datacenter=dc2'"
          - ""
          - "4. Schedule a failover drill to test end-to-end"
      tags:
        - always
