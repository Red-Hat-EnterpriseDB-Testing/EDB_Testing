---
# Playbook: Execute SQL Query using collection role
# This playbook runs SQL queries on PostgreSQL databases using the execute_sql role

- name: Execute SQL Query on PostgreSQL Databases
  hosts: postgres_clusters
  gather_facts: false
  
  roles:
    - role: edb.postgres_operations.execute_sql
      vars:
        sql_query: "{{ sql_query | default('SELECT version();') }}"
        sql_file: "{{ sql_file | default(None) }}"
        run_on: "{{ run_on | default('all') }}"
