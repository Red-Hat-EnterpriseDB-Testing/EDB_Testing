---
# Playbook: manage-aap-cluster.yml
# Manage AAP cluster operations (scale up/down, start/stop, status)

- name: Manage AAP cluster
  hosts: "{{ target_hosts | default('localhost') }}"
  gather_facts: false
  become: "{{ aap_require_become | default(false) }}"
  
  vars:
    # Required: Action to perform
    # - scale_up: Scale AAP pods to operational replica counts (OpenShift)
    # - scale_down: Scale AAP pods to zero replicas (OpenShift)
    # - start: Start AAP systemd services (RHEL)
    # - stop: Stop AAP systemd services (RHEL)
    # - status: Check AAP cluster status
    aap_action: "{{ manage_aap_cluster_action | default('status') }}"
    
    # Deployment type: openshift or rhel
    aap_deployment_type: "{{ manage_aap_cluster_deployment_type | default('openshift') }}"
    
    # OpenShift settings
    aap_namespace: "{{ manage_aap_cluster_namespace | default('ansible-automation-platform') }}"
    aap_context: "{{ manage_aap_cluster_context | default('') }}"
    
  tasks:
    - name: Display operation summary
      ansible.builtin.debug:
        msg:
          - "AAP Cluster Management"
          - "===================="
          - "Action: {{ aap_action }}"
          - "Deployment: {{ aap_deployment_type }}"
          - "Namespace: {{ aap_namespace if aap_deployment_type == 'openshift' else 'N/A' }}"
          - "Context: {{ aap_context if aap_context else 'default' }}"
      tags:
        - always
    
    - name: Execute AAP cluster management
      ansible.builtin.include_role:
        name: edb.postgres_operations.manage_aap_cluster
      vars:
        manage_aap_cluster_action: "{{ aap_action }}"
        manage_aap_cluster_deployment_type: "{{ aap_deployment_type }}"
        manage_aap_cluster_namespace: "{{ aap_namespace }}"
        manage_aap_cluster_context: "{{ aap_context }}"
      tags:
        - manage_aap
