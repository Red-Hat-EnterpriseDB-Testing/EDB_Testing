---
# Ansible Inventory for Multi-Datacenter PostgreSQL
# This inventory works with the edb.postgres_operations collection

all:
  children:
    # OpenShift Clusters Group
    openshift_clusters:
      children:
        datacenter1:
          hosts:
            ocp1:
              ansible_host: api.ocp1.example.com
              ansible_port: 6443
              kubeconfig_path: ~/.aap/kubeconfig.ocp1
              datacenter: dc1
              location: "Primary Datacenter"
              
        datacenter2:
          hosts:
            ocp2:
              ansible_host: api.ocp2.example.com
              ansible_port: 6443
              kubeconfig_path: ~/.aap/kubeconfig.ocp2
              datacenter: dc2
              location: "DR Site"

    # PostgreSQL Clusters Group
    postgres_clusters:
      children:
        production_databases:
          hosts:
            prod_db_dc1:
              pg_host: prod-db-rw.production.svc.cluster.local
              pg_port: 5432
              pg_database: app
              pg_user: app
              namespace: production
              cluster_name: prod-db
              datacenter: dc1
              openshift_cluster: ocp1
              kubeconfig_path: ~/.aap/kubeconfig.ocp1
              is_primary: true
              environment: production
              
            prod_db_dc2:
              pg_host: prod-db-rw.production.svc.cluster.local
              pg_port: 5432
              pg_database: app
              pg_user: app
              namespace: production
              cluster_name: prod-db
              datacenter: dc2
              openshift_cluster: ocp2
              kubeconfig_path: ~/.aap/kubeconfig.ocp2
              is_primary: false
              replication_source: prod_db_dc1
              environment: production
              
        staging_databases:
          hosts:
            stage_db_dc1:
              pg_host: stage-db-rw.staging.svc.cluster.local
              pg_port: 5432
              pg_database: stage
              pg_user: stage_user
              namespace: staging
              cluster_name: stage-db
              datacenter: dc1
              openshift_cluster: ocp1
              kubeconfig_path: ~/.aap/kubeconfig.ocp1
              environment: staging
              
        development_databases:
          hosts:
            dev_db_dc2:
              pg_host: dev-db-rw.development.svc.cluster.local
              pg_port: 5432
              pg_database: dev
              pg_user: dev_user
              namespace: development
              cluster_name: dev-db
              datacenter: dc2
              openshift_cluster: ocp2
              kubeconfig_path: ~/.aap/kubeconfig.ocp2
              environment: development

  # Global variables
  vars:
    ansible_connection: local
    ansible_python_interpreter: /usr/bin/python3
    
    # EDB Operator Configuration
    edb_operator_version: "1.28.0"
    edb_operator_namespace: postgresql-operator-system
    
    # PostgreSQL Defaults
    pg_version: "16.8"
    pg_connection_timeout: 30
    
    # Backup Configuration
    backup_retention_days: 30
    backup_s3_endpoint: s3.amazonaws.com
    
    # Monitoring Configuration
    prometheus_enabled: true
    metrics_port: 9187
    
    # Collection-specific Variables
    validate_prerequisites_enabled: false
