---
# Ansible Galaxy requirements for edb.postgres_operations collection

collections:
  # Required collections
  - name: kubernetes.core
    version: ">=2.3.0"
  
  - name: community.postgresql
    version: ">=2.0.0"
  
  # Optional but recommended collections
  - name: ansible.posix
    version: ">=1.4.0"
  
  - name: community.general
    version: ">=5.0.0"

# Install with:
# ansible-galaxy collection install -r requirements.yml
