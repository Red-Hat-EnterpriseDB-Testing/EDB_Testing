---
# Ansible Playbook: Deploy PostgreSQL Cluster
# This playbook deploys a PostgreSQL cluster using the EDB Postgres operator

- name: Deploy PostgreSQL Cluster on OpenShift
  hosts: openshift_clusters
  gather_facts: false
  
  vars:
    cluster_name: "{{ cluster_name | default('my-postgres') }}"
    namespace: "{{ namespace | default('default') }}"
    instances: "{{ instances | default(3) }}"
    storage_size: "{{ storage_size | default('10Gi') }}"
    storage_class: "{{ storage_class | default('local-path') }}"
    postgres_version: "{{ postgres_version | default('16.8') }}"
    
  tasks:
    - name: Ensure namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ namespace }}"
            labels:
              datacenter: "{{ datacenter }}"
              managed-by: ansible-automation-platform

    - name: Copy EDB pull secret to namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: edb-pull-secret
            namespace: "{{ namespace }}"
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: "{{ lookup('file', 'secrets/edb-dockerconfig.json') | b64encode }}"

    - name: Create database credentials secret
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ cluster_name }}-superuser"
            namespace: "{{ namespace }}"
          type: kubernetes.io/basic-auth
          stringData:
            username: postgres
            password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=32') }}"

    - name: Deploy PostgreSQL Cluster
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: postgresql.k8s.enterprisedb.io/v1
          kind: Cluster
          metadata:
            name: "{{ cluster_name }}"
            namespace: "{{ namespace }}"
            labels:
              datacenter: "{{ datacenter }}"
              environment: production
          spec:
            instances: "{{ instances }}"
            imageName: "docker.enterprisedb.com/k8s/postgresql:{{ postgres_version }}"
            
            # Bootstrap configuration
            bootstrap:
              initdb:
                database: app
                owner: app
                secret:
                  name: "{{ cluster_name }}-app-user"
            
            # Storage configuration
            storage:
              size: "{{ storage_size }}"
              storageClass: "{{ storage_class }}"
            
            # Image pull secrets
            imagePullSecrets:
              - name: edb-pull-secret
            
            # Resource limits
            resources:
              requests:
                memory: "512Mi"
                cpu: "250m"
              limits:
                memory: "1Gi"
                cpu: "1000m"
            
            # Monitoring
            monitoring:
              enablePodMonitor: true
            
            # High availability
            postgresql:
              parameters:
                max_connections: "200"
                shared_buffers: "256MB"
                work_mem: "4MB"
                maintenance_work_mem: "64MB"
            
            # Backup configuration (optional)
            # backup:
            #   barmanObjectStore:
            #     destinationPath: "s3://{{ backup_bucket }}/{{ cluster_name }}"
            #     s3Credentials:
            #       accessKeyId:
            #         name: backup-s3-creds
            #         key: ACCESS_KEY_ID
            #       secretAccessKey:
            #         name: backup-s3-creds
            #         key: SECRET_ACCESS_KEY
            #     wal:
            #       compression: gzip
            #       encryption: AES256

    - name: Wait for cluster to be ready
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Cluster
        namespace: "{{ namespace }}"
        name: "{{ cluster_name }}"
      register: cluster_status
      until: cluster_status.resources[0].status.phase == "Cluster in healthy state"
      retries: 30
      delay: 10

    - name: Display cluster information
      debug:
        msg:
          - "Cluster Name: {{ cluster_name }}"
          - "Namespace: {{ namespace }}"
          - "Datacenter: {{ datacenter }}"
          - "Instances: {{ instances }}"
          - "Primary Pod: {{ cluster_status.resources[0].status.currentPrimary }}"
          - "Read-Write Service: {{ cluster_name }}-rw.{{ namespace }}.svc.cluster.local"
          - "Read-Only Service: {{ cluster_name }}-ro.{{ namespace }}.svc.cluster.local"

    - name: Get superuser password
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Secret
        namespace: "{{ namespace }}"
        name: "{{ cluster_name }}-superuser"
      register: superuser_secret

    - name: Save credentials to AAP credential store
      ansible.builtin.debug:
        msg: "Store these credentials in AAP: {{ superuser_secret.resources[0].data.password | b64decode }}"
      no_log: true
