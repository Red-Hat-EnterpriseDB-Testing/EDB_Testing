---
# Ansible Playbook: Check PostgreSQL Cluster Health
# This playbook monitors the health of PostgreSQL clusters across datacenters

- name: Check PostgreSQL Cluster Health
  hosts: openshift_clusters
  gather_facts: false
  
  tasks:
    - name: Get EDB operator status
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Deployment
        namespace: postgresql-operator-system
        name: postgresql-operator-controller-manager
      register: operator_status

    - name: Get all PostgreSQL clusters
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Cluster
        api_version: postgresql.k8s.enterprisedb.io/v1
      register: postgres_clusters

    - name: Analyze cluster health
      set_fact:
        cluster_health:
          datacenter: "{{ datacenter }}"
          location: "{{ location }}"
          operator_ready: "{{ operator_status.resources[0].status.readyReplicas == 1 }}"
          clusters: "{{ postgres_clusters.resources | map(attribute='metadata.name') | list }}"
          total_clusters: "{{ postgres_clusters.resources | length }}"
          healthy_clusters: "{{ postgres_clusters.resources | selectattr('status.phase', 'equalto', 'Cluster in healthy state') | list | length }}"

    - name: Check each cluster details
      set_fact:
        cluster_details: >-
          {{
            postgres_clusters.resources | map('dict2items') | flatten |
            selectattr('key', 'in', ['metadata', 'status']) |
            map(attribute='value')
          }}

    - name: Display cluster health summary
      debug:
        msg:
          - "═══════════════════════════════════════════"
          - "Datacenter: {{ datacenter }} ({{ location }})"
          - "Operator Status: {{ 'Healthy' if cluster_health.operator_ready else 'Unhealthy' }}"
          - "Total Clusters: {{ cluster_health.total_clusters }}"
          - "Healthy Clusters: {{ cluster_health.healthy_clusters }}"
          - "═══════════════════════════════════════════"

    - name: Display individual cluster status
      debug:
        msg:
          - "Cluster: {{ item.metadata.name }} ({{ item.metadata.namespace }})"
          - "  Status: {{ item.status.phase | default('Unknown') }}"
          - "  Primary: {{ item.status.currentPrimary | default('N/A') }}"
          - "  Instances: {{ item.status.instances | default(0) }}"
          - "  Ready Instances: {{ item.status.readyInstances | default(0) }}"
          - "  PostgreSQL Version: {{ item.status.image | default('Unknown') }}"
          - "  ---"
      loop: "{{ postgres_clusters.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Check for issues
      set_fact:
        issues: []

    - name: Identify unhealthy clusters
      set_fact:
        issues: "{{ issues + [item.metadata.name + ' in ' + datacenter + ' is unhealthy'] }}"
      when: item.status.phase != "Cluster in healthy state"
      loop: "{{ postgres_clusters.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Check replication lag (if applicable)
      kubernetes.core.k8s_exec:
        kubeconfig: "{{ kubeconfig_path }}"
        namespace: "{{ item.metadata.namespace }}"
        pod: "{{ item.status.currentPrimary }}"
        command: >
          psql -U postgres -c "SELECT
            client_addr,
            state,
            pg_wal_lsn_diff(pg_current_wal_lsn(), replay_lsn) as lag_bytes
          FROM pg_stat_replication;"
      register: replication_status
      loop: "{{ postgres_clusters.resources }}"
      when: item.status.instances > 1
      loop_control:
        label: "{{ item.metadata.name }}"
      ignore_errors: true

    - name: Display replication status
      debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ replication_status.results }}"
      when: item.stdout_lines is defined
      loop_control:
        label: "Replication status"

    - name: Alert if issues found
      debug:
        msg:
          - "⚠️  ALERT: Issues detected in {{ datacenter }}"
          - "{{ issues }}"
      when: issues | length > 0

    - name: Trigger AAP notification on issues
      uri:
        url: "{{ aap_webhook_url | default('http://aap.example.com/api/v2/webhook/') }}"
        method: POST
        body_format: json
        body:
          datacenter: "{{ datacenter }}"
          issues: "{{ issues }}"
          timestamp: "{{ ansible_date_time.iso8601 }}"
        status_code: [200, 201]
      when: 
        - issues | length > 0
        - aap_webhook_url is defined
      delegate_to: localhost

- name: Generate Health Report
  hosts: localhost
  gather_facts: false
  
  tasks:
    - name: Aggregate results
      debug:
        msg:
          - "═══════════════════════════════════════════"
          - "Multi-Datacenter PostgreSQL Health Report"
          - "Generated: {{ ansible_date_time.iso8601 }}"
          - "═══════════════════════════════════════════"
          - "All datacenters checked successfully"
          - "Review individual datacenter reports above"
