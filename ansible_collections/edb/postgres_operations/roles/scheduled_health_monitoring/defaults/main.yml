---
# Scheduled health monitoring defaults (alerting, reporting, AAP integration)

check_operator: true
check_clusters: true
check_replication: true
check_pvc_status: true
check_service_endpoints: true

replication_lag_threshold: 10485760  # 10MB
max_pod_restart_count: 5

enable_alerts: true
alert_on_unhealthy: true
alert_on_replication_lag: true

enable_aap_notifications: true
aap_webhook_url: "{{ lookup('env', 'AAP_WEBHOOK_URL') | default('') }}"

generate_report: true
save_report: true
report_format: json
report_output_dir: /var/log/postgres-health

show_cluster_details: true
show_pod_details: true
show_replication_details: true
