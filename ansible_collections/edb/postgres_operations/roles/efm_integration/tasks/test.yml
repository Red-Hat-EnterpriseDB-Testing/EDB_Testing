# Test EFM AAP integration

- name: test | Verify wrapper script exists
  ansible.builtin.stat:
    path: "{{ efm_integration_script_target_dir }}/efm-aap-failover-wrapper.sh"
  register: __efm_integration_wrapper_script
  failed_when: not __efm_integration_wrapper_script.stat.exists

- name: test | Determine test context based on datacenter
  ansible.builtin.set_fact:
    __efm_integration_test_context: "{{ efm_integration_openshift_contexts[efm_integration_test_datacenter] }}"
  when: efm_integration_aap_deployment_type == 'openshift'

- name: test | Construct test node address
  ansible.builtin.set_fact:
    __efm_integration_test_node_address: >-
      {{ efm_integration_test_node_address if efm_integration_test_node_address != 'test-node.example.com'
         else 'prod-db-replica-' + efm_integration_test_datacenter + '.example.com' }}

- name: test | Display test parameters
  ansible.builtin.debug:
    msg:
      - "EFM AAP Integration Test"
      - "======================="
      - "Cluster Name: {{ efm_integration_test_cluster_name }}"
      - "Node Type: {{ efm_integration_test_node_type }}"
      - "Node Address: {{ __efm_integration_test_node_address }}"
      - "Datacenter: {{ efm_integration_test_datacenter }}"
      - "VIP: {{ efm_integration_test_vip }}"
      - "Context: {{ __efm_integration_test_context | default('N/A') }}"

- name: test | Execute wrapper script as efm user
  ansible.builtin.command:
    cmd: >-
      {{ efm_integration_script_target_dir }}/efm-aap-failover-wrapper.sh
      {{ efm_integration_test_cluster_name }}
      {{ efm_integration_test_node_type }}
      {{ __efm_integration_test_node_address }}
      {{ efm_integration_test_vip }}
  become_user: "{{ efm_integration_efm_user }}"
  register: __efm_integration_test_result
  changed_when: false
  failed_when: false

- name: test | Read wrapper log
  ansible.builtin.command:
    cmd: tail -50 {{ efm_integration_wrapper_log }}
  register: __efm_integration_test_log
  changed_when: false
  failed_when: false

- name: test | Analyze test results
  ansible.builtin.set_fact:
    __efm_integration_test_passed: >-
      {{
        __efm_integration_test_result.rc == 0 and
        ('AAP cluster scaled up successfully' in __efm_integration_test_log.stdout or
         'AAP cluster startup complete' in __efm_integration_test_log.stdout)
      }}

- name: test | Display test results
  ansible.builtin.debug:
    msg:
      - "Test Results"
      - "============"
      - "Status: {{ 'PASSED ✓' if __efm_integration_test_passed else 'FAILED ✗' }}"
      - "Exit Code: {{ __efm_integration_test_result.rc }}"
      - ""
      - "Script Output:"
      - "{{ __efm_integration_test_result.stdout_lines | default([]) | join('\n') }}"
      - ""
      - "Log Tail:"
      - "{{ __efm_integration_test_log.stdout_lines[-10:] | default([]) | join('\n') }}"
      - ""
      - "Full Log: {{ efm_integration_wrapper_log }}"

- name: test | Fail if test did not pass
  ansible.builtin.fail:
    msg: "EFM AAP integration test failed. Check logs at {{ efm_integration_wrapper_log }}"
  when: not __efm_integration_test_passed
