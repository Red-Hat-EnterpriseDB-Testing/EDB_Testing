# Configure EFM to call AAP failover scripts

- name: configure | Verify EFM configuration file exists
  ansible.builtin.stat:
    path: "{{ efm_integration_efm_properties_file }}"
  register: __efm_integration_properties_file
  failed_when: not __efm_integration_properties_file.stat.exists

- name: configure | Backup EFM configuration
  ansible.builtin.copy:
    src: "{{ efm_integration_efm_properties_file }}"
    dest: "{{ efm_integration_efm_properties_file }}{{ efm_integration_backup_suffix }}"
    remote_src: true
    owner: "{{ efm_integration_efm_user }}"
    group: "{{ efm_integration_efm_group }}"
    mode: "0600"
  when: efm_integration_backup_config | bool

- name: configure | Enable custom scripts in EFM
  ansible.builtin.lineinfile:
    path: "{{ efm_integration_efm_properties_file }}"
    regexp: "^#?enable.custom.scripts="
    line: "enable.custom.scripts={{ efm_integration_enable_custom_scripts | string | lower }}"
    owner: "{{ efm_integration_efm_user }}"
    group: "{{ efm_integration_efm_group }}"
    mode: "0600"
  notify: restart efm

- name: configure | Set script timeout
  ansible.builtin.lineinfile:
    path: "{{ efm_integration_efm_properties_file }}"
    regexp: "^#?script.timeout="
    line: "script.timeout={{ efm_integration_script_timeout }}"
    owner: "{{ efm_integration_efm_user }}"
    group: "{{ efm_integration_efm_group }}"
    mode: "0600"
  notify: restart efm

- name: configure | Set post-promotion script
  ansible.builtin.lineinfile:
    path: "{{ efm_integration_efm_properties_file }}"
    regexp: "^#?script.post.promotion="
    line: >-
      script.post.promotion={{
        efm_integration_script_target_dir }}/{{
        'efm-orchestrated-failover.sh' if efm_integration_use_orchestrated_failover
        else 'efm-aap-failover-wrapper.sh'
      }} %h %s %a %v
    owner: "{{ efm_integration_efm_user }}"
    group: "{{ efm_integration_efm_group }}"
    mode: "0600"
  notify: restart efm

- name: configure | Read current EFM configuration
  ansible.builtin.slurp:
    src: "{{ efm_integration_efm_properties_file }}"
  register: __efm_integration_current_config

- name: configure | Display configuration summary
  ansible.builtin.debug:
    msg:
      - "✓ EFM Configuration Updated"
      - "Properties File: {{ efm_integration_efm_properties_file }}"
      - "Custom Scripts: Enabled"
      - "Script Timeout: {{ efm_integration_script_timeout }} seconds"
      - "Post-Promotion Script: {{ 'efm-orchestrated-failover.sh' if efm_integration_use_orchestrated_failover else 'efm-aap-failover-wrapper.sh' }}"
      - "Orchestrated Failover: {{ efm_integration_use_orchestrated_failover }}"
      - ""
      - "Backup Created: {{ efm_integration_efm_properties_file }}{{ efm_integration_backup_suffix }}"
      - ""
      - "Next Steps:"
      - "1. Review configuration: cat {{ efm_integration_efm_properties_file }}"
      - "2. Restart EFM: systemctl restart edb-efm-{{ efm_integration_efm_version }}"
      - "3. Test integration: ansible-playbook -e 'efm_integration_action=test' ..."
