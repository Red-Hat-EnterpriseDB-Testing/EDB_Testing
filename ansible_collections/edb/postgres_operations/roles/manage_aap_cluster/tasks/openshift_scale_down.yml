# OpenShift scale down tasks

- name: openshift_scale_down | Set kubeconfig environment
  ansible.builtin.set_fact:
    __manage_aap_cluster_k8s_auth:
      kubeconfig: "{{ manage_aap_cluster_kubeconfig }}"
      context: "{{ manage_aap_cluster_context if manage_aap_cluster_context else omit }}"
  no_log: false

- name: openshift_scale_down | Verify namespace exists
  kubernetes.core.k8s_info:
    kind: Namespace
    name: "{{ manage_aap_cluster_namespace }}"
    kubeconfig: "{{ __manage_aap_cluster_k8s_auth['kubeconfig'] }}"
    context: "{{ __manage_aap_cluster_k8s_auth['context'] | default(omit) }}"
  register: __manage_aap_cluster_namespace_check
  failed_when: __manage_aap_cluster_namespace_check.resources | length == 0

- name: openshift_scale_down | Get current AAP deployments
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ manage_aap_cluster_namespace }}"
    label_selectors:
      - "app.kubernetes.io/component in (automation-controller, automation-hub, gateway)"
    kubeconfig: "{{ __manage_aap_cluster_k8s_auth['kubeconfig'] }}"
    context: "{{ __manage_aap_cluster_k8s_auth['context'] | default(omit) }}"
  register: __manage_aap_cluster_current_deployments

- name: openshift_scale_down | Scale down AAP deployments to 0
  kubernetes.core.k8s_scale:
    kind: Deployment
    name: "{{ item }}"
    namespace: "{{ manage_aap_cluster_namespace }}"
    replicas: 0
    kubeconfig: "{{ __manage_aap_cluster_k8s_auth['kubeconfig'] }}"
    context: "{{ __manage_aap_cluster_k8s_auth['context'] | default(omit) }}"
    wait: false
  loop: "{{ manage_aap_cluster_deployments }}"
  loop_control:
    label: "{{ item }}"
  register: __manage_aap_cluster_scale_down_results
  # Continue even if some deployments don't exist
  failed_when: false

- name: openshift_scale_down | Wait for pods to terminate
  ansible.builtin.pause:
    seconds: 10
    prompt: "Waiting for pods to terminate..."

- name: openshift_scale_down | Verify pods are scaled down
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ manage_aap_cluster_namespace }}"
    label_selectors:
      - "app.kubernetes.io/component in (automation-controller, automation-hub, gateway)"
    kubeconfig: "{{ __manage_aap_cluster_k8s_auth['kubeconfig'] }}"
    context: "{{ __manage_aap_cluster_k8s_auth['context'] | default(omit) }}"
  register: __manage_aap_cluster_remaining_pods

- name: openshift_scale_down | Display scale down results
  ansible.builtin.debug:
    msg:
      - "✓ AAP cluster scaled down successfully"
      - "Namespace: {{ manage_aap_cluster_namespace }}"
      - "Remaining pods: {{ __manage_aap_cluster_remaining_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length }}"
      - "Note: Database pods are intentionally NOT scaled down"
