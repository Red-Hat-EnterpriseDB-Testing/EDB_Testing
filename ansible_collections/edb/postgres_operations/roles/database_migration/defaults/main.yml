---
# Database migration workflow defaults

migration_version: "v1.0"
migration_file: "./migrations/{{ migration_version }}/migration.sql"
migration_verify_file: "./migrations/{{ migration_version }}/verify.sql"

# SQL execution
transaction_mode: true
fail_on_error: true
autocommit: false
save_results: true
results_output_dir: /var/log/migrations
query_timeout: 300

# Health check options for pre/post migration
migration_check_replication: true
migration_fail_on_unhealthy: true

# Schema table for tracking (must exist or be created by migration)
migration_schema_table: schema_migrations
