---
- name: Pre-migration health check
  ansible.builtin.include_role:
    name: edb.postgres_operations.check_health
  vars:
    check_replication: "{{ migration_check_replication }}"
    fail_on_unhealthy: "{{ migration_fail_on_unhealthy }}"

- name: Create backup before migration
  ansible.builtin.debug:
    msg: "Creating backup before migration..."
  # In real scenario, trigger backup job here

- name: Wait for backup to complete
  ansible.builtin.pause:
    seconds: 30

- name: Check if migration already applied
  ansible.builtin.include_role:
    name: edb.postgres_operations.execute_sql
  vars:
    sql_query: "SELECT version FROM {{ migration_schema_table }} WHERE version = '{{ migration_version }}';"
    display_results: true
  register: migration_check_applied

- name: Run database migration
  ansible.builtin.include_role:
    name: edb.postgres_operations.execute_sql
  vars:
    sql_file: "{{ migration_file }}"
    transaction_mode: "{{ transaction_mode }}"
    fail_on_error: "{{ fail_on_error }}"
    log_queries: true
  when: processed_results.results | default([]) | length == 0

- name: Record migration version
  ansible.builtin.include_role:
    name: edb.postgres_operations.execute_sql
  vars:
    sql_query: "INSERT INTO {{ migration_schema_table }} (version, applied_at) VALUES ('{{ migration_version }}', NOW());"
    display_results: false
  when: processed_results.results | default([]) | length == 0

- name: Check if verify file exists
  ansible.builtin.stat:
    path: "{{ migration_verify_file }}"
  register: migration_verify_stat
  delegate_to: localhost
  become: false

- name: Verify migration
  ansible.builtin.include_role:
    name: edb.postgres_operations.execute_sql
  vars:
    sql_file: "{{ migration_verify_file }}"
    display_results: true
  when: migration_verify_stat.stat.exists | default(false) | bool

- name: Post-migration health check
  ansible.builtin.include_role:
    name: edb.postgres_operations.check_health
  vars:
    check_replication: "{{ migration_check_replication }}"
    fail_on_unhealthy: "{{ migration_fail_on_unhealthy }}"

- name: Notify success
  ansible.builtin.debug:
    msg:
      - "Migration {{ migration_version }} completed successfully on {{ cluster_name }}@{{ datacenter }}"
