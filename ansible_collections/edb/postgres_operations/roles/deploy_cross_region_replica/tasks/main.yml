---
- name: Verify volume snapshot exists and is ready
  kubernetes.core.k8s_info:
    kind: VolumeSnapshot
    name: "{{ volume_snapshot_name }}"
    namespace: "{{ source_namespace }}"
    kubeconfig: "{{ source_kubeconfig_path | expanduser }}"
  register: snapshot_info
  failed_when: >
    snapshot_info.resources | length == 0 or
    not snapshot_info.resources[0].status.readyToUse | default(false)
  when: bootstrap_method == 'recovery_volume_snapshot'

- name: Deploy cross-region replica cluster
  ansible.builtin.include_role:
    name: edb.postgres_operations.deploy_replica_cluster
