---
- name: Validate scaling variables
  ansible.builtin.assert:
    that:
      - kubeconfig_path is defined
      - scale_aap_controller | bool or scale_postgres_cluster | bool
    fail_msg: "Set scale_aap_controller and/or scale_postgres_cluster to true; ensure kubeconfig_path is set (e.g. from inventory)."

- name: Scale AAP controller deployment
  kubernetes.core.k8s_scale:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Deployment
    name: "{{ aap_deployment_name }}"
    namespace: "{{ aap_namespace }}"
    replicas: "{{ aap_replicas }}"
  when: scale_aap_controller | bool

- name: Scale EDB PostgreSQL cluster (spec.instances)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition: "{{ postgres_cluster_definition }}"
  when: scale_postgres_cluster | bool
  vars:
    postgres_cluster_definition:
      apiVersion: "{{ postgres_cluster_api_group }}/v1"
      kind: "{{ postgres_cluster_kind }}"
      metadata:
        name: "{{ cluster_name }}"
        namespace: "{{ namespace }}"
      spec:
        instances: "{{ postgres_instances }}"
  # Note: k8s state=present with minimal definition may not patch; use k8s_patch if needed
  register: scale_postgres_result

# Use k8s_patch for JSON patch to only change spec.instances (safer for existing clusters)
- name: Patch EDB PostgreSQL cluster instances (horizontal scale)
  kubernetes.core.k8s_patch:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: "{{ postgres_cluster_kind }}"
    name: "{{ cluster_name }}"
    namespace: "{{ namespace }}"
    api_version: "{{ postgres_cluster_api_group }}/v1"
    patch:
      spec:
        instances: "{{ postgres_instances }}"
  when: scale_postgres_cluster | bool
