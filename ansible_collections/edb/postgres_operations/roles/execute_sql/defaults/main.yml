---
# Default variables for execute_sql role
# These can be overridden at playbook level or via extra vars

# SQL Query Configuration
sql_query: "SELECT version();"
sql_file: null
sql_queries: []  # List of multiple queries to execute sequentially

# Execution Control
run_on: "all"  # Options: all, primary, production, staging, development
autocommit: true
transaction_mode: false  # Run all queries in a single transaction

# Connection Configuration
pg_connection_timeout: 30
pg_connect_timeout: 10
pg_ssl_mode: "prefer"  # Options: disable, allow, prefer, require, verify-ca, verify-full

# Query Options
fail_on_error: true
ignore_errors: false
continue_on_error: false  # Continue to next query even if one fails

# Output Control
display_results: true
display_row_limit: 100  # Maximum rows to display
save_results: false
results_output_dir: "/tmp/ansible-sql-results"
results_format: "json"  # Options: json, yaml, csv

# Logging Configuration
log_queries: true
log_to_aap: true
log_sensitive: false  # Set to false to hide query parameters in logs

# Retry Configuration
retry_on_failure: false
retry_attempts: 3
retry_delay: 5

# Performance Monitoring
measure_execution_time: true
query_timeout: 300  # seconds

# Security
use_vault_password: false
vault_password_key: "db_password"
