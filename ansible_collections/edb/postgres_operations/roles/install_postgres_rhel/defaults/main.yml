---
# Default variables for install_postgres_rhel role
# Override at playbook level or via extra vars / group_vars

postgres_version: "16"
install_pgd: false
edb_repo_url: "https://yum.enterprisedb.com/edb-repo-rpms/edb-repo-latest.noarch.rpm"
pg_port: "5432"
pg_listen_addresses: "'*'"
pg_max_connections: "1500"
pg_shared_buffers: "256MB"
pg_data_dir: "/var/lib/edb/as{{ postgres_version }}/data"
app_database: "app_db"
app_owner: "app_user"
app_password: "change_me"
pg_hba_cidr: "10.0.0.0/8"
firewall_enabled: true
