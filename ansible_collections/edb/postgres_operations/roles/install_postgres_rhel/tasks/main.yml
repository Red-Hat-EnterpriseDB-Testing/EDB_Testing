---
# Tasks for install_postgres_rhel role
# Installs EDB repo, PostgreSQL (or PGD), configures postgresql.conf/pg_hba.conf,
# firewall, and creates application user and database.

- name: Install EDB repository
  ansible.builtin.dnf:
    name: "{{ edb_repo_url }}"
    state: present

- name: Install PostgreSQL server and PGD (optional)
  ansible.builtin.dnf:
    name:
      - "postgresql{{ postgres_version }}-server"
      - "edb-pgd5"
    state: present
  when: install_pgd | bool

- name: Install PostgreSQL server only
  ansible.builtin.dnf:
    name: "postgresql{{ postgres_version }}-server"
    state: present
  when: not (install_pgd | bool)

- name: Initialize database (if not already initialized)
  ansible.builtin.command:
    cmd: "postgresql-setup --initdb"
    creates: "{{ pg_data_dir }}/postgresql.conf"
  changed_when: true
  ignore_errors: true

- name: Set listen_addresses in postgresql.conf
  ansible.builtin.lineinfile:
    path: "{{ pg_data_dir }}/postgresql.conf"
    regexp: "^#?listen_addresses\\s*="
    line: "listen_addresses = {{ pg_listen_addresses }}"
    backup: true

- name: Set max_connections in postgresql.conf
  ansible.builtin.lineinfile:
    path: "{{ pg_data_dir }}/postgresql.conf"
    regexp: "^#?max_connections\\s*="
    line: "max_connections = {{ pg_max_connections }}"
    backup: true

- name: Set shared_buffers in postgresql.conf
  ansible.builtin.lineinfile:
    path: "{{ pg_data_dir }}/postgresql.conf"
    regexp: "^#?shared_buffers\\s*="
    line: "shared_buffers = {{ pg_shared_buffers }}"
    backup: true

- name: Add host rule to pg_hba.conf
  ansible.builtin.lineinfile:
    path: "{{ pg_data_dir }}/pg_hba.conf"
    line: "host    all             all             {{ pg_hba_cidr }}               scram-sha-256"
    backup: true
  register: pg_hba_change

- name: Restart PostgreSQL
  ansible.builtin.systemd:
    name: "edb-as-{{ postgres_version }}"
    state: restarted
  when: pg_hba_change.changed | default(false)

- name: Open firewall port for PostgreSQL
  ansible.posix.firewalld:
    port: "{{ pg_port }}/tcp"
    permanent: true
    state: enabled
  when: firewall_enabled | bool

- name: Reload firewall
  ansible.posix.firewalld:
    state: reloaded
  when: firewall_enabled | bool

- name: Create application role
  community.postgresql.postgresql_user:
    name: "{{ app_owner }}"
    password: "{{ app_password }}"
    state: present
    port: "{{ pg_port }}"
  no_log: true

- name: Create application database
  community.postgresql.postgresql_db:
    name: "{{ app_database }}"
    owner: "{{ app_owner }}"
    state: present
    port: "{{ pg_port }}"
