---
# Development environment variables (match deploy_development_cluster role defaults)
# Usage: ansible-playbook playbook.yml -e @playbooks/examples/vars/development.yml

# Environment
environment: development

# Cluster sizing for development (minimal)
instances: 1
min_available_instances: 1

# Storage configuration (smaller)
storage_size: 10Gi
storage_class: local-path
storage_wal_size: 5Gi

# Resource allocation (minimal)
resource_requests_memory: 512Mi
resource_requests_cpu: 250m
resource_limits_memory: 1Gi
resource_limits_cpu: 1000m

# PostgreSQL tuning for development
pg_max_connections: "100"
pg_shared_buffers: "128MB"
pg_work_mem: "4MB"
pg_maintenance_work_mem: "64MB"
pg_effective_cache_size: "256MB"

# Monitoring (optional)
monitoring_enabled: false
monitoring_pod_monitor: false

# Backups (disabled for dev)
backup_enabled: false

# High availability (not needed for dev)
enable_pod_disruption_budget: false
wait_for_cluster_ready: true
wait_timeout: 300

# Health checks (basic)
check_replication: false
check_pvc_status: false
