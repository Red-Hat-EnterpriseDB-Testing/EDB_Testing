---
# Production environment variables (match deploy_production_cluster role defaults)
# Usage: ansible-playbook playbook.yml -e @playbooks/examples/vars/production.yml

# Environment
environment: production

# Cluster sizing for production
instances: 5
min_available_instances: 2

# Storage configuration
storage_size: 500Gi
storage_class: fast-ssd
storage_wal_size: 100Gi

# Resource allocation
resource_requests_memory: 4Gi
resource_requests_cpu: 2000m
resource_limits_memory: 8Gi
resource_limits_cpu: 4000m

# PostgreSQL tuning for production
pg_max_connections: "500"
pg_shared_buffers: "2GB"
pg_work_mem: "16MB"
pg_maintenance_work_mem: "512MB"
pg_effective_cache_size: "4GB"

# Monitoring
monitoring_enabled: true
monitoring_pod_monitor: true

# Backups
backup_enabled: true
backup_retention_days: 90
backup_wal_compression: gzip
backup_wal_encryption: AES256

# High availability
enable_pod_disruption_budget: true
wait_for_cluster_ready: true
wait_timeout: 600

# Health checks
check_replication: true
check_pvc_status: true
replication_lag_threshold: 10485760  # 10MB
