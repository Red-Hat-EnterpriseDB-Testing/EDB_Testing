---
# Database migration workflow (uses database_migration role)
# Usage: ansible-playbook playbooks/examples/run-database-migration.yml -i inventory/example-multi-datacenter.yml -e "migration_version=v2.1"

- name: Database Migration Workflow
  hosts: production_databases
  gather_facts: false
  serial: 1
  roles:
    - role: edb.postgres_operations.database_migration
