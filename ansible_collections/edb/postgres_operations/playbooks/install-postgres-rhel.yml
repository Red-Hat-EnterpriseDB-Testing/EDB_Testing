---
# Playbook: Install EDB Postgres on RHEL
# Uses the install_postgres_rhel role from this collection.
#
# Usage (from project root):
#   ansible-playbook -i inventory ansible_collections/edb/postgres_operations/playbooks/install-postgres-rhel.yml
#   ansible-playbook -i inventory .../install-postgres-rhel.yml -e postgres_version=16 -e install_pgd=true
#   ansible-playbook -i inventory .../install-postgres-rhel.yml -e app_password=Secret --ask-vault-pass
#
# Requires: community.postgresql, ansible.posix (see collection requirements.yml)

- name: Install EDB Postgres on RHEL
  hosts: postgres_servers
  become: true
  roles:
    - role: edb.postgres_operations.install_postgres_rhel
