# Overlay: StorageClass lvms-vg1 (common with LVMS/TopoLVM on some OpenShift setups).
# kubectl/oc apply -k cannot load ../../base (load restrictor). Build then apply — see db-deploy/README.md
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Cluster
      name: demo-pg
      namespace: edb-pg-demo
    patch: |-
      - op: add
        path: /spec/storage/storageClass
        value: lvms-vg1
