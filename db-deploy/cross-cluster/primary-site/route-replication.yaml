# Expose the CloudNativePG / EDB Postgres read-write Service for cross-cluster streaming replication.
# Apply on the OpenShift cluster that hosts the *primary* `Cluster` (same namespace as that resource).
#
# The replica connects with sslmode=verify-ca when the server TLS cert is issued for in-cluster DNS
# (the Route hostname usually will not match the certSAN; verify-full would require custom certs).
#
# If your primary `Cluster` name is not `postgresql`, change `spec.to.name` to `<cluster>-rw`.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: postgresql-replication
  namespace: edb-postgres
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: streaming-replication
spec:
  port:
    targetPort: 5432
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: None
  to:
    kind: Service
    name: postgresql-rw
    weight: 100
  wildcardPolicy: None
