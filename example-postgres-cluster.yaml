apiVersion: postgresql.k8s.enterprisedb.io/v1
kind: Cluster
metadata:
  name: example-postgres
  namespace: default
spec:
  # Number of PostgreSQL instances (primary + replicas)
  instances: 3
  
  # PostgreSQL version
  imageName: docker.enterprisedb.com/k8s/postgresql:16.8
  
  # Bootstrap configuration
  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: app-user-secret
  
  # Storage configuration
  storage:
    size: 1Gi
    storageClass: local-path
  
  # Monitoring configuration
  monitoring:
    enablePodMonitor: false
  
  # Image pull secrets
  imagePullSecrets:
    - name: edb-pull-secret
  
  # Resource requests and limits
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

---
apiVersion: v1
kind: Secret
metadata:
  name: app-user-secret
  namespace: default
type: kubernetes.io/basic-auth
stringData:
  username: app
  password: app-password-change-me
