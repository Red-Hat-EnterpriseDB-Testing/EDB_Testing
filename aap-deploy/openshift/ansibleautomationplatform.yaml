# Parent CR for AAP 2.6 — all default components with external PostgreSQL (one server, four databases).
# Before apply:
#   - Create unmanaged DB secrets (see scripts/generate-postgres-secrets.sh or examples/).
#   - Set spec.hub.file_storage_storage_class to a ReadWriteMany StorageClass available on the cluster
#     (Hub content storage; LVMS TopoLVM defaults are often RWO-only — use NFS, CephFS, ODF, etc.).
# Official guide: https://docs.redhat.com/en/documentation/red_hat_ansible_automation_platform/2.6/html-single/installing_on_openshift_container_platform/index
apiVersion: aap.ansible.com/v1alpha1
kind: AnsibleAutomationPlatform
metadata:
  name: aap
  namespace: ansible-automation-platform
spec:
  # Replace with your cluster’s RWX StorageClass for Automation Hub artifact storage.
  hub:
    storage_type: file
    file_storage_storage_class: ocs-storagecluster-cephfs
    file_storage_size: 10Gi
    postgres_configuration_secret: external-postgres-configuration-hub
  controller:
    postgres_configuration_secret: external-postgres-configuration-controller
  database:
    database_secret: external-postgres-configuration-gateway
  eda:
    database:
      database_secret: external-postgres-configuration-eda
