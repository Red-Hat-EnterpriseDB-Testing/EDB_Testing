---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dr-test-results-pvc
  namespace: edb-postgres
  labels:
    app: dr-testing
    component: storage
spec:
  accessModes:
  - ReadWriteOnce

  resources:
    requests:
      storage: 5Gi

  storageClassName: gp3  # Adjust to your storage class
